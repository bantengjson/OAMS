# OAMS - Office Asset Management System
# Jalankan di server: salin .env.example -> .env, isi nilainya, lalu
#   docker compose up -d --build

name: oams

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oams}
      POSTGRES_USER: ${POSTGRES_USER:-oams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # Sengaja tanpa `ports`: database hanya bisa diakses dari jaringan internal.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-oams}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oams}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks:
      - internal
      - edge
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        API_URL: http://backend:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://backend:4000
    networks:
      - edge
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot
    networks:
      - edge
    depends_on:
      - frontend
      - backend

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-oams}
      POSTGRES_USER: ${POSTGRES_USER:-oams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infrastructure/postgres:/scripts:ro
      - ./backups:/backups
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    # Backup pertama saat start, lalu setiap 24 jam. Sinkronkan ./backups ke
    # penyimpanan terpisah dari server (rsync/rclone) sesuai kebijakan kantor.
    entrypoint: ["sh", "-c", "while true; do sh /scripts/backup.sh || echo '[backup] gagal'; sleep 86400; done"]

volumes:
  pgdata:
  uploads:
  certbot-www:

networks:
  internal:
    internal: true
  edge:
