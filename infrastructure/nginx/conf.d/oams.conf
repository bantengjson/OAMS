# Reverse proxy OAMS: /api/* -> NestJS, selain itu -> Next.js.
# Sertifikat TLS diletakkan di infrastructure/nginx/certs (fullchain.pem, privkey.pem).

upstream oams_backend {
  server backend:4000;
  keepalive 16;
}

upstream oams_frontend {
  server frontend:3000;
  keepalive 16;
}

# HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;

  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  proxy_read_timeout 60s;

  location /api/ {
    proxy_pass http://oams_backend;
  }

  location / {
    proxy_pass http://oams_frontend;
  }
}
